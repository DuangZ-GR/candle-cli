name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all

  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install "pytest>=8,<9" "transformers>=4.40,<5"
      - run: python -m pip install "torch>=2.2" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m compileall -q python
      - run: python -m pytest -q python
        env:
          PYTHONPATH: python

  benchmark-integrity:
    name: Schema and benchmark integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install "pytest>=8,<9"
      - run: cargo test --locked --test test_bootstrap --test test_migration_schema
      - run: python -m pytest -q python/test_migration_schema.py python/test_trace_benchmark.py python/test_agent_experiment.py
        env:
          PYTHONPATH: python
      - run: cargo run --locked --quiet -- security-heldout > security-heldout.json
      - run: python -c "import json; r=json.load(open('security-heldout.json')); assert r['passed'] and r['dataset_split']=='frozen_heldout'"
